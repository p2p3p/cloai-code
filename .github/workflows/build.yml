name: Build cloai binary

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target platform'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux-arm64
          - linux-x64
          - win32-x64
          - darwin-arm64
          - darwin-x64

permissions:
  contents: write
  actions: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.getver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: getver
        run: |
          VERSION=$(cat package.json | grep '"version"' | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build:
    needs: [version]
    strategy:
      matrix:
        platform: ${{ fromJSON(inputs.arch == 'all' && '["linux-arm64","linux-x64","win32-x64","darwin-arm64","darwin-x64"]' || format('["{0}"]', inputs.arch)) }}
    runs-on: ${{ fromJSON('{"linux-arm64":"ubuntu-24.04-arm","linux-x64":"ubuntu-24.04","win32-x64":"ubuntu-24.04","darwin-arm64":"macos-14","darwin-x64":"macos-15"}')[matrix.platform] }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        env:
          BUN_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          bun install --no-frozen-lockfile --force
          bun add @anthropic-ai/bedrock-sdk @anthropic-ai/foundry-sdk @anthropic-ai/vertex-sdk
          bun add @aws-sdk/client-bedrock @aws-sdk/client-sts
          bun add @azure/identity
          bun add @opentelemetry/exporter-logs-otlp-grpc @opentelemetry/exporter-logs-otlp-http @opentelemetry/exporter-logs-otlp-proto
          bun add @opentelemetry/exporter-metrics-otlp-grpc @opentelemetry/exporter-metrics-otlp-http @opentelemetry/exporter-metrics-otlp-proto
          bun add @opentelemetry/exporter-prometheus
          bun add @opentelemetry/exporter-trace-otlp-grpc @opentelemetry/exporter-trace-otlp-http @opentelemetry/exporter-trace-otlp-proto
          bun add sharp turndown

      - name: Create stub files for missing dynamic imports
        run: |
          mkdir -p src/assistant src/commands/assistant src/components/agents src/tools/REPLTool src/tools/SuggestBackgroundPRTool src/tools/VerifyPlanExecutionTool src/services/compact src/ink
          echo 'export default {}' > src/services/compact/cachedMicrocompact.js
          echo 'export default {}' > src/ink/devtools.js
          echo 'export default {}' > src/assistant/AssistantSessionChooser.js
          echo 'export default {}' > src/commands/assistant/assistant.js
          echo 'export default {}' > src/components/agents/SnapshotUpdateDialog.js
          echo 'export default {}' > src/tools/REPLTool/REPLTool.js
          echo 'export default {}' > src/tools/SuggestBackgroundPRTool/SuggestBackgroundPRTool.js
          echo 'export default {}' > src/tools/VerifyPlanExecutionTool/VerifyPlanExecutionTool.js

      - name: Build standalone binary
        id: build
        run: |
          case "${{ matrix.platform }}" in
            linux-arm64)  TARGET="bun-linux-arm64"  BINARY="cloai" ;;
            linux-x64)    TARGET="bun-linux-x64"    BINARY="cloai" ;;
            win32-x64)    TARGET="bun-windows-x64"  BINARY="cloai.exe" ;;
            darwin-arm64) TARGET="bun-darwin-arm64" BINARY="cloai" ;;
            darwin-x64)   TARGET="bun-darwin-x64"   BINARY="cloai" ;;
          esac
          echo "binary=$BINARY" >> $GITHUB_OUTPUT
          bun build --compile --minify \
            --target "$TARGET" \
            ./src/bootstrap-entry.ts \
            --outfile "$BINARY"

      - name: Package binary
        id: package
        run: |
          BINARY=${{ steps.build.outputs.binary }}
          case "${{ matrix.platform }}" in
            linux-arm64)  OUTFILE="cloai-linux-arm64.tar.gz" ;;
            linux-x64)    OUTFILE="cloai-linux-x64.tar.gz" ;;
            win32-x64)    OUTFILE="cloai-win32-x64.zip" ;;
            darwin-arm64) OUTFILE="cloai-darwin-arm64.tar.gz" ;;
            darwin-x64)   OUTFILE="cloai-darwin-x64.tar.gz" ;;
          esac
          if [ "${{ matrix.platform }}" = "win32-x64" ]; then
            zip "$OUTFILE" "$BINARY"
          else
            tar czf "$OUTFILE" "$BINARY"
          fi
          echo "artifact=$OUTFILE" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ steps.package.outputs.artifact }}
          compression-level: 0

  release:
    needs: [version, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          TAG="v$VERSION"
          NOTES="Cloai v$VERSION 自动构建"
          gh release create "$TAG" --repo ${{ github.repository }} \
            --title "Cloai v$VERSION" \
            --notes "$NOTES" || true
          for f in artifacts/*/*; do
            echo "Uploading: $f"
            gh release upload "$TAG" --repo ${{ github.repository }} "$f" --clobber || true
          done
